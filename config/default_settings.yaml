## Legacy interactive preset. Production jobs must use mjw-web-v2.yaml.
convert_to_srgb: true
create_subfolder: true
input_folder: input
jpeg_quality: 88
long_edge_pixels: 2400
max_height: 1080
max_width: 1920
max_workers: 4
output_dpi: 72
output_folder: output
output_format: JPEG
pdf_dpi: 200
png_compression: 6
preserve_aspect_ratio: true
preserve_metadata: false
metadata_policy: public
subfolder_name: web_optimized
target_max_size_kb: 2500
text_font_size_ratio: 0.012
text_outline_color:
- 0
- 0
- 0
- 0
text_outline_width: 0
text_rotation_angle: -30
text_spacing_ratio: 1.8
text_watermark_color:
- 128
- 128
- 128
text_watermark_opacity: 30
tile_opacity_reduction: 0.7
tile_size_ratio: 0.18
tile_spacing_ratio: 1.6
use_multiprocessing: true
use_text_outline: false
use_text_watermark: true
use_tiled_watermark: true
watermark_opacity: 0.1
watermark_path: ''
watermark_position: center
watermark_scale: 0.2
watermark_text: © Michael J Wright Estate
web_output_suffix: _web
webp_quality: 88
