[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processor-pro"
version = "2.0.0"
description = "Local-first, fixity-aware MJW archive derivative renderer"
requires-python = ">=3.11"
dependencies = [
  "Pillow==12.3.0",
  "PyYAML==6.0.3",
  "loguru==0.7.3",
]

[project.optional-dependencies]
gui = ["customtkinter==5.2.2"]
pdf = ["PyMuPDF==1.28.0"]
api = ["Flask==3.1.3"]
azure = ["azure-storage-blob==12.30.0", "azure-identity==1.25.1"]
vision-legacy = ["azure-cognitiveservices-vision-computervision==0.9.0"]
build = ["pyinstaller==6.19.0"]
dev = ["pytest==9.0.3", "pytest-cov==7.0.0", "pip-audit==2.10.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["image_processor", "job_manifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
