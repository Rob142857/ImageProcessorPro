[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processor-pro"
version = "2.0.0"
description = "Local-first, fixity-aware MJW archive derivative renderer"
requires-python = ">=3.11"
dependencies = [
  "Pillow==13.0.0",
  "PyYAML==6.0.3",
  "loguru==0.7.3",
]

[project.optional-dependencies]
gui = ["customtkinter==6.0.0"]
pdf = ["PyMuPDF==2.0"]
api = ["Flask==3.1.3"]
azure = ["azure-storage-blob==12.31.0", "azure-identity==1.26.0"]
vision-legacy = ["azure-cognitiveservices-vision-computervision==0.9.1"]
build = ["pyinstaller==6.22.3"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "pip-audit==2.10.1"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["image_processor", "job_manifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
